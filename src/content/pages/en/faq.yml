seoTitle: Frequently asked questions
seoDescription: >-
  Mondial Relay pickup point delivery, pickup in Arnouville, delivery times,
  payment, returns, storage and origins: our answers to your questions.
title: Frequently asked questions
lead: Everything you need to know before ordering. Another question? Write to us.
items:
  - question: How long does delivery take?
    answer: >-
      We pack your parcel within 2 working days. Then allow 3 to 5 working days
      to a Mondial Relay pickup point and 2 to 4 working days for home delivery
      with Colissimo.
  - question: How does pickup point delivery work?
    answer: >-
      When you order, choose a Mondial Relay pickup point on the map, near your
      home or your work. You receive a text and an e-mail as soon as the parcel
      arrives; it then waits for you for several days. Remember to bring photo ID.
      We deliver to pickup points in France, Belgium and
      Luxembourg.
  - question: Is delivery free?
    answer: >-
      Yes, from €49, whatever the delivery method. Below that, pickup point
      delivery costs €4.90 and home delivery €6.90.
  - question: Can I collect my order in person?
    answer: >-
      Yes, pickup is free at 9 Rue du Marché, Arnouville (95), by appointment.
      Choose "Free pickup in Arnouville" when you order: we will contact you as
      soon as your order is ready.
  - question: Which payment methods do you accept?
    answer: >-
      Payments are handled by Stripe, a secure platform: debit or credit card (CB, Visa,
      Mastercard) and, depending on your device, Apple Pay or Google Pay. We
      never see your card details.
  - question: How can I find my order?
    answer: >-
      Go to the "Track my order" page (/en/my-order/), linked at the bottom of
      every page. Enter the order number shown in your confirmation e-mail and
      the e-mail address you ordered with: you will see the details of your
      order, without creating an account.
  - question: Can I return a product?
    answer: >-
      Our products are food: once a pouch is opened it cannot be taken back, for
      hygiene reasons (article L221-28 of the French Consumer Code). For an
      unopened pouch, you have 14 days after delivery to tell us you are
      withdrawing, then 14 days to send it back. If your parcel arrives damaged,
      send us a photo and we will replace or refund the products concerned.
  - question: How should I store the products?
    answer: >-
      In a dry place, away from heat and moisture, closing the pouch tightly after
      each use. The best-before date is printed on every pouch.
  - question: Where do your products come from?
    answer: >-
      The origin is stated on every product page: moringa and tiger nut from
      Niger, baobab from Senegal, hibiscus from Cameroon, cacao from Côte
      d’Ivoire, psyllium from India, roasted barley from Germany. All our
      products are 100% plant-based, with no additive and no preservative. Every pouch is packed in France by ESAT Les
      Oliviers in Gennevilliers.
  - question: Can I review a product?
    answer: >-
      With pleasure! About a week after your order, you receive an e-mail
      inviting you to review each product you ordered. We read every review
      before it goes online; reviews marked "Verified purchase" come from an
      order placed on the site.
  - question: Can I hear about your news?
    answer: >-
      Yes, sign up to our newsletter at the bottom of every page. You receive a
      confirmation e-mail: your subscription is confirmed when you click the
      link inside. Every message includes an unsubscribe link.
  - question: Do you sell to businesses?
    answer: >-
      Grocers, restaurants, works councils: write to us at
      racinesenpartage@gmail.com or call +33 7 75 68 91 08, we will be glad to
      answer.
