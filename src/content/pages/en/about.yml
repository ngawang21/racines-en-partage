seoTitle: Our story
seoDescription: >-
  Racines en Partage links two lands, West Africa and France. Simple products,
  packed by ESAT Les Oliviers in Gennevilliers.
title: Our story
lead: >-
  Racines en Partage is a small house in Arnouville, north of Paris. It offers
  powders, flowers, seeds and cacao found on West-African tables, in plain kraft
  pouches.
sections:
  - title: Two lands
    body: >-
      Moringa and tiger nut come from Niger, baobab from Senegal, cacao from Côte
      d’Ivoire, psyllium from India. These products have accompanied generations
      of family kitchens. We want to make them easy to find here, with their
      origin written in black and white.
    imageAlt: Three Racines en Partage kraft pouches resting on sand among palm leaves
  - title: One ritual
    body: >-
      A bissap infusion shared in the afternoon, tiger nut milk prepared the night
      before, a spoonful of moringa in the morning smoothie. Every pouch carries
      a serving idea and, often, a little recipe drawn from our habits.
  - title: A partnership with ESAT Les Oliviers
    body: >-
      Our products are packed in France by ESAT Les Oliviers in Gennevilliers.
      An ESAT is a sheltered workshop that supports people with disabilities
      through work. Weighing, filling, labelling: every pouch passes through
      their hands.
    imageAlt: A pouch of baobab powder and a pouch of roasted barley flour
  - title: Simple ingredients
    body: >-
      One ingredient per pouch. No additive, no preservative, no colouring. What
      is written on the label is what you find in the pouch, and nothing more.
