seoTitle: Our story
seoDescription: >-
  Racines en Partage links two lands, West Africa and France. Simple products,
  packed by ESAT Les Oliviers in Gennevilliers.
title: Our story
lead: >-
  Racines en Partage is a small family business in Arnouville, north of Paris. It offers
  powders, flowers, seeds and cacao found on West African tables, in kraft
  pouches.
sections:
  - title: Two lands
    body: >-
      Moringa and tiger nut come from Niger, baobab from Senegal, hibiscus from
      Cameroon, cacao from Côte d’Ivoire. These plants have been part of West
      African family kitchens for generations. Psyllium from India and roasted
      barley from Germany complete the range. We want to make these products
      easy to find here, with their origin written in black and white.
    imageAlt: Three Racines en Partage kraft pouches standing on palm leaves
  - title: One ritual
    body: >-
      A bissap infusion shared in the afternoon, tiger nut milk prepared the night
      before, a spoonful of moringa in the morning smoothie. Every pouch carries
      a serving idea and, often, a little recipe from our own kitchen.
  - title: A partnership with ESAT Les Oliviers
    body: >-
      Our products are packed in France by ESAT Les Oliviers in Gennevilliers.
      An ESAT is a sheltered workshop that supports people with disabilities
      through work. Weighing, filling, labelling: every pouch passes through
      their hands.
    imageAlt: A pouch of baobab powder and a pouch of roasted barley flour
  - title: Simple ingredients
    body: >-
      All our products are 100% plant-based, with no additive and no
      preservative. One ingredient per pouch, no colouring. What
      is written on the label is what you find in the pouch.
