seoTitle: Our story
seoDescription: >-
  Racines en Partage was born between two lands, between tropical and temperate
  zones: plants from Africa and Asia, packed by ESAT Les Oliviers in
  Gennevilliers.
title: Our story
lead: >-
  Racines en Partage is a small family business based in the Val-d’Oise, north
  of Paris. It offers powders, flowers, seeds and cacao found on African and
  Asian tables, in kraft pouches.
sections:
  - title: Two lands
    body: >-
      Moringa and tiger nut come from Niger, baobab from Senegal, hibiscus from
      Cameroon, cacao from Côte d’Ivoire. These plants have been part of West
      African family kitchens for generations. Psyllium from India and roasted
      barley from Germany complete the range. We want to make these products
      easy to find here, with their origin written in black and white.
    imageAlt: A pouch of hibiscus flowers and a pouch of psyllium on palm leaves
  - title: One ritual
    body: >-
      A bissap infusion shared in the afternoon, tiger nut milk prepared the night
      before, a spoonful of moringa in the morning smoothie. Every pouch guides
      you: a serving idea and a little house recipe from our everyday life.
    imageAlt: The window of a pouch of tiger nuts, under the edge of the label
  - title: A partnership with ESAT Les Oliviers
    body: >-
      ESAT Les Oliviers in Gennevilliers, in the Hauts-de-Seine, which
      supports the work of people with disabilities, is with us on this
      adventure. They do the weighing, the filling and the labelling: every
      pouch passes through their hands.
    imageAlt: A pouch of baobab powder and a pouch of roasted barley flour
  - title: Simple ingredients
    body: >-
      Our products are 100% plant-based and guaranteed free from additives,
      preservatives and colourings. With a single ingredient per pouch, there
      are no surprises: what is written on the label is what you find inside.
    imageAlt: The window of a pouch of cacao nibs, under the edge of the label
