seoTitle: 'Racines en Partage: West African powders, herbal teas and cacao'
seoDescription: >-
  Moringa, baobab, bissap, tiger nut, Ivorian cacao: simple products with no
  additives, packed in France by ESAT Les Oliviers. Delivery to Mondial Relay
  pickup points.
hero:
  # A no-break space keeps “West African” on one line.
  title: West African plants, in a kraft pouch.
  lead: >-
    Moringa, hibiscus, baobab, tiger nut, cacao: one ingredient per pouch, to
    brew, to blend into a smoothie or to sprinkle over a dish.
  cta:
    primary: Visit the shop
    secondary: Our story
  imageAlt: >-
    Three Racines en Partage kraft pouches, roasted barley, hibiscus and
    moringa, standing on palm leaves
reassurance:
  - icon: leaf
    text: 100% plant-based, no additives or preservatives
  - icon: pin
    text: Packed in France by ESAT Les Oliviers
  - icon: truck
    text: Pickup point delivery, free from €49
  - icon: lock
    text: Secure payment
featuredTitle: Our essentials
storyTitle: Two lands
storyBody: >-
  Racines en Partage was born between two lands: West Africa, where moringa,
  bissap and tiger nut are part of everyday life, and France, where we live.
storyLands:
  from: [Niger, Senegal, Cameroon, Côte d’Ivoire, India, Germany]
  to: Arnouville
ritualTitle: One ritual, three moments
ritual:
  - time: In the morning
    text: A spoon of moringa in the smoothie.
    product: poudre-de-moringa-100g
  - time: In the afternoon
    text: Iced hibiscus, brewed the day before.
    product: fleurs-d-hibiscus-bissap-100g
  - time: In the evening
    text: Hot chocolate with Ivorian cacao.
    product: poudre-de-cacao-100g
commitmentTitle: Our commitments
commitmentBody: >-
  ESAT Les Oliviers in Gennevilliers is a sheltered workshop that supports
  people with disabilities through work. Weighing, filling, labelling: every
  pouch passes through their hands.
