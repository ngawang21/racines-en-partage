featuredTitle: Our essentials
storyTitle: Two lands
storyBody: >-
  Racines en Partage was born between two lands: West Africa, where moringa,
  bissap and tiger nut are part of everyday life, and France, where we live. We
  choose products from Niger, Senegal, Côte d'Ivoire and India, then have them
  packed in the Paris region. Our philosophy: taking care of ourselves by sharing
  the taste and the goodness of our homelands.
storyLands:
  from: [Niger, Senegal, Côte d'Ivoire, India]
  to: Arnouville
categoriesTitle: Our ranges
recipesTitle: Little recipes
commitmentTitle: Our commitments
commitmentBody: >-
  Our pouches are packed by ESAT Les Oliviers in Gennevilliers, a sheltered
  workshop that supports people with disabilities through work. We state the
  origin of every product, we keep ingredient lists short, and we add no
  additive, no preservative and no colouring.
