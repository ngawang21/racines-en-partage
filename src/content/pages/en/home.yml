featuredTitle: Our essentials
storyTitle: Two lands
storyBody: >-
  Racines en Partage was born between two lands: West Africa, where moringa,
  bissap and tiger nut are part of everyday life, and France, where we live.
  The moringa and tiger nut come from Niger, the baobab from Senegal, the
  hibiscus from Cameroon, the cacao from Côte d’Ivoire. Two companions come
  from further afield: psyllium from India and roasted barley from Germany.
  Everything is packed in the Paris region.
storyLands:
  from: [Niger, Senegal, Cameroon, Côte d’Ivoire, India, Germany]
  to: Arnouville
ritualTitle: One ritual, three moments
