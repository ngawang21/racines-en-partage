title: Contact us
lead: >-
  A question about a product, an order or a request for hand delivery? Write to
  us or call us: we reply personally.
hours: >-
  We answer Monday to Saturday, 9 am to 7 pm. Free hand delivery on request:
  write to us on WhatsApp to agree on a place and a time.
