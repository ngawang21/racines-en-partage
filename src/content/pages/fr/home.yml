  - tubercules-de-souchet-200g
  - poudre-de-cacao-100g
commitmentTitle: Nos engagements
commitmentBody: >-
  Nos sachets sont conditionnés par l’ESAT Les Oliviers, à Gennevilliers, un
  établissement qui accompagne par le travail des personnes en situation de
  handicap. Nous indiquons l’origine de chaque produit, nous gardons des listes
  d’ingrédients courtes, et nous n’ajoutons ni additif, ni conservateur, ni
  colorant.
