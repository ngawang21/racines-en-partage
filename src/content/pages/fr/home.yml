featuredTitle: Nos incontournables
storyTitle: Deux terres
# Owner to validate (Marie’s own words welcome).
storyBody: >-
  Racines en Partage est née entre deux terres : l’Afrique de l’Ouest, où le
  moringa, le bissap et le souchet font partie du quotidien, et la France, où
  nous vivons. Nous choisissons des produits du Niger, du Sénégal, de Côte
  d’Ivoire et d’Inde, puis nous les faisons conditionner en Île-de-France. Notre
  philosophie : partager le goût et les savoir-faire de nos
  terroirs.
