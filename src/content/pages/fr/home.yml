seoTitle: 'Racines en Partage : poudres, tisanes et cacao d’Afrique de l’Ouest'
seoDescription: >-
  Moringa, baobab, bissap, souchet, cacao ivoirien : des produits simples, sans
  additifs, conditionnés en France par l’ESAT Les Oliviers. Livraison en Point
  Relais Mondial Relay.
hero:
  # A no-break space joins “de” and “l’Ouest” (one line break fewer).
  title: Les plantes d’Afrique de l’Ouest, en sachet kraft.
  lead: >-
    Moringa, bissap, baobab, souchet, cacao : un seul ingrédient par sachet,
    à infuser, à mixer dans un smoothie ou à saupoudrer sur un plat.
  cta:
    primary: Découvrir la boutique
    secondary: Notre histoire
  imageAlt: >-
    Trois sachets kraft Racines en Partage, orge grillée, hibiscus et moringa,
    posés sur le sable entre des feuilles de palmier
reassurance:
  - icon: leaf
    text: 100 % végétal, sans additif ni conservateur
  - icon: pin
    text: Conditionné en France par l’ESAT Les Oliviers
  - icon: truck
    text: Livraison en Point Relais, offerte dès 49 €
  - icon: lock
    text: Paiement sécurisé
featuredTitle: Nos incontournables
storyTitle: Deux terres
# Owner to validate (Marie’s own words welcome). Keep storyLands.from in line
# with the product origins (a unit test checks). The lands show as chips under
# the text, so the text does not list them again (a unit test checks).
storyBody: >-
  Racines en Partage est née entre deux terres : l’Afrique de l’Ouest, où le
  moringa, le bissap et le souchet font partie du quotidien, et la France, où
  nous vivons.
storyLands:
  from: [Niger, Sénégal, Cameroun, Côte d’Ivoire, Inde, Allemagne]
  to: Arnouville
# Le mot de Marie : à écrire avec elle (trois phrases, signées), par exemple
# ownerNote:
#   text: >-
#     ...
#   signature: Marie
ritualTitle: Un rituel, trois moments
ritual:
  - time: Le matin
    text: Une cuillère de moringa dans le smoothie.
    product: poudre-de-moringa-100g
  - time: L’après-midi
    text: Un bissap glacé, infusé la veille.
    product: fleurs-d-hibiscus-bissap-100g
  - time: Le soir
    text: Un chocolat chaud au cacao de Côte d’Ivoire.
    product: poudre-de-cacao-100g
commitmentTitle: Nos engagements
# The three commitments (origin, short lists, no additive) are the list next
# to this text (locales, shop.commitments): the text tells the ESAT only.
commitmentBody: >-
  Nos sachets sont conditionnés par l’ESAT Les Oliviers, à Gennevilliers, un
  établissement qui accompagne par le travail des personnes en situation de
  handicap.
