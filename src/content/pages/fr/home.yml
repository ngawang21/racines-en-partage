featuredTitle: Nos incontournables
storyTitle: Deux terres
# Owner to validate (Marie’s own words welcome). Keep storyLands.from in line
# with the product origins (a unit test checks).
storyBody: >-
  Racines en Partage est née entre deux terres : l’Afrique de l’Ouest, où le
  moringa, le bissap et le souchet font partie du quotidien, et la France, où
  nous vivons. Le moringa et le souchet viennent du Niger, le baobab du
  Sénégal, le bissap du Cameroun, le cacao de Côte d’Ivoire. Deux compagnons
  viennent d’ailleurs : le psyllium d’Inde et l’orge grillée d’Allemagne. Tout
  est mis en sachet en Île-de-France.
storyLands:
  from: [Niger, Sénégal, Cameroun, Côte d’Ivoire, Inde, Allemagne]
  to: Arnouville
recipesTitle: Petites recettes
