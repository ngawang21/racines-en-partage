# Owner to validate: the story is written from the brief and the labels.
seoTitle: Notre histoire
seoDescription: >-
  Racines en Partage relie deux terres : l’Afrique de l’Ouest et la France.
  Des produits simples, conditionnés par l’ESAT Les Oliviers à Gennevilliers.
title: Notre histoire
lead: >-
  Racines en Partage est une petite maison d’Arnouville, dans le Val-d’Oise. Elle
  propose des poudres, des fleurs, des graines et du cacao que l’on retrouve sur
  les tables d’Afrique de l’Ouest, en sachets kraft.
sections:
  - title: Deux terres
    body: >-
      Le moringa et le souchet viennent du Niger, le baobab du Sénégal,
      l’hibiscus du Cameroun, le cacao de Côte d’Ivoire. Ces plantes ont
      accompagné des générations de cuisines familiales en Afrique de l’Ouest.
      Le psyllium d’Inde et l’orge grillée d’Allemagne les complètent. Nous
      voulons rendre ces produits faciles à trouver ici, avec leur origine
      écrite noir sur blanc.
    image: /src/assets/brand/hero-trio.webp
    imageAlt: >-
      Trois sachets kraft Racines en Partage posés sur le sable entre des
      feuilles de palmier
  - title: Un rituel
    body: >-
      Une infusion de bissap partagée l’après-midi, un lait de souchet préparé la
      veille, une cuillère de moringa dans le smoothie du matin. Chaque sachet
      porte une idée d’utilisation et, souvent, une petite recette tirée de nos
      habitudes.
  - title: Un partenariat avec l’ESAT Les Oliviers
    body: >-
      Nos produits sont conditionnés en France par l’ESAT Les Oliviers, à
      Gennevilliers (92). Un ESAT est un établissement qui accompagne par le
      travail des personnes en situation de handicap. Pesée, ensachage,
      étiquetage : chaque sachet passe entre leurs mains.
    image: /src/assets/brand/duo-baobab-orge.webp
    imageAlt: Un sachet de poudre de baobab et un sachet de poudre d’orge grillée
  - title: Des ingrédients simples
    body: >-
      Tous nos produits sont 100 % végétaux, sans additif ni conservateur. Un
      seul ingrédient par sachet, pas de colorant. Ce qui est écrit sur
      l’étiquette est ce que vous trouvez dans le sachet.
