seoTitle: Questions fréquentes
seoDescription: >-
  Livraison en Point Relais Mondial Relay, retrait à Arnouville, délais, paiement,
  retours, conservation et origines : nos réponses à vos questions.
title: Questions fréquentes
lead: Tout ce qu’il faut savoir avant de commander. Une autre question ? Écrivez-nous.
items:
  - question: Quels sont les délais de livraison ?
    answer: >-
      Nous préparons votre colis sous 2 jours ouvrés. Comptez ensuite 3 à 5 jours
      ouvrés en Point Relais Mondial Relay et 2 à 4 jours ouvrés en livraison à
      domicile avec Colissimo.
  - question: Comment fonctionne la livraison en Point Relais ?
    answer: >-
      Au moment de commander, choisissez un Point Relais Mondial Relay sur la
      carte, près de chez vous ou de votre travail. Vous recevez un SMS et un
      e-mail dès que le colis est arrivé ; il vous attend alors plusieurs jours.
      Pensez à vous munir d’une pièce d’identité. Nous livrons les Points Relais
      en France, en Belgique et au Luxembourg.
  - question: La livraison est-elle offerte ?
    answer: >-
      Oui, dès 49 € d’achat, quel que soit le mode de livraison. En dessous, la
      livraison en Point Relais coûte 4,90 € et la livraison à domicile 6,90 €.
  - question: Puis-je retirer ma commande sur place ?
    answer: >-
      Oui, le retrait est gratuit au 9 Rue du Marché, à Arnouville (95), sur
      rendez-vous. Choisissez « Retrait gratuit à Arnouville » au moment de
      commander : nous vous contactons dès que votre commande est prête.
  - question: Quels moyens de paiement acceptez-vous ?
    answer: >-
      Le paiement passe par Stripe, une plateforme sécurisée : carte bancaire
      (CB, Visa, Mastercard) et, selon votre appareil, Apple Pay ou Google Pay.
      Nous ne voyons jamais vos données bancaires.
  - question: Puis-je retourner un produit ?
    answer: >-
      Nos produits sont des denrées alimentaires : une fois le sachet ouvert, ils
      ne peuvent pas être repris, pour des raisons d’hygiène (article L221-28 du
      code de la consommation). Pour un sachet fermé, vous disposez de 14 jours
      après la réception pour nous signaler votre rétractation, puis de 14 jours
      pour nous le renvoyer. Si votre colis arrive abîmé, envoyez-nous une
      photo : nous remplaçons ou remboursons les produits concernés.
  - question: Comment conserver les produits ?
    answer: >-
      Dans un endroit sec, à l’abri de la chaleur et de l’humidité, et en
      refermant bien le sachet après chaque utilisation. La date de durabilité
      minimale est indiquée sur chaque sachet.
  - question: D’où viennent vos produits ?
    answer: >-
      L’origine est indiquée sur chaque fiche produit : moringa et souchet du
      Niger, baobab du Sénégal, cacao de Côte d’Ivoire, psyllium d’Inde, orge
      grillée d’Allemagne. Tous les sachets sont conditionnés en France par l’ESAT
      Les Oliviers, à Gennevilliers.
  - question: Vendez-vous aux professionnels ?
    answer: >-
      Épiceries, restaurants, CSE : écrivez-nous à
      racinesenpartage@outlook.com ou appelez le 07 75 68 91 08, nous vous
      répondrons avec plaisir.
