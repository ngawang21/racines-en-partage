# Recette de l’étiquette du sachet (source: label). Les textes viennent de l’étiquette.
order: 2
product: poudre-de-baobab-100g
source: label
prepMinutes: 2
title: 'Boisson fraîche au baobab'
summary: 'La poudre de baobab délayée dans l’eau fraîche : une boisson acidulée, prête en deux minutes.'
yield: '1 grand verre'
ingredients:
  - '1 à 2 cuillères à café de poudre de baobab'
  - '250 ml d’eau fraîche'
  - '1 cuillère à café de miel ou de sucre selon votre goût'
  - 'Quelques glaçons'
steps:
  - 'Mélangez la poudre de baobab avec un peu d’eau, puis ajoutez progressivement le reste de l’eau.'
  - 'Sucrez selon votre goût et servez bien frais.'
tips:
  - 'La pulpe se dépose au fond du verre : remuez avant de boire.'
  - 'Un trait de jus de citron vert ou quelques feuilles de menthe relèvent son goût acidulé.'
  - 'Pour la version sénégalaise, plus épaisse et adoucie de lait, voyez le jus de bouye.'
