title: 'Boisson fraîche au baobab'
summary: 'La poudre de baobab délayée dans l’eau fraîche : une boisson acidulée, prête en deux minutes.'
yield: '1 grand verre'
ingredients:
  - '1 à 2 cuillères à café de poudre de baobab'
  - '250 ml d’eau fraîche'
