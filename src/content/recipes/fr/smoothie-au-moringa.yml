# Recette de l’étiquette du sachet (source: label). Les textes viennent de l’étiquette.
order: 3
product: poudre-de-moringa-100g
source: label
prepMinutes: 5
title: 'Smoothie au moringa'
summary: 'Une cuillère de poudre de moringa, une banane, un fruit : le smoothie vert de l’étiquette, pour le matin.'
yield: '1 grand verre'
ingredients:
  - '1 cuillère à café de poudre de moringa'
  - '1 banane bien mûre'
  - '1 pomme ou quelques morceaux d’ananas'
  - '200 ml d’eau ou de lait végétal'
  - '1 cuillère à café de miel selon votre goût'
  - 'Quelques glaçons'
steps:
  - 'Mettre tous les ingrédients dans un mixeur.'
  - 'Mixer jusqu’à obtenir une préparation homogène et onctueuse.'
  - 'Servir frais.'
