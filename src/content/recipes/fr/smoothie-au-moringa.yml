# Recette de la maison (source: house), dans la version de la propriétaire, validée le 2026-11-23 (docs/client/recettes-a-valider.md).
order: 3
product: poudre-de-moringa-100g
source: house
prepMinutes: 5
title: 'Smoothie au moringa'
summary: 'Une cuillère de poudre de moringa, un fruit : le smoothie de la maison pour le matin ou le goûter.'
yield: '1 grand verre'
ingredients:
  - '1 cuillère à café de poudre de moringa'
  - '1 kaki bien mûr'
  - '200 ml de lait de coco'
  - 'Un peu de cannelle'
  - '1 cuillère à café de miel selon votre goût'
  - 'Quelques glaçons'
steps:
  - 'Retirez le pédoncule du kaki et coupez le fruit en morceaux.'
  - 'Mettez tous les ingrédients dans un mixeur.'
  - 'Mixez jusqu’à obtenir une préparation homogène et onctueuse.'
  - 'Servez frais.'
tips:
  - 'Si vous découvrez le moringa, commencez par une demi-cuillère : son goût herbacé, entre épinard et thé vert, se remarque vite.'
  - 'La framboise et la mangue fonctionnent aussi très bien, testez !'
  - 'Buvez-le aussitôt : il garde ainsi sa belle couleur.'
