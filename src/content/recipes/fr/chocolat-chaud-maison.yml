# Recette de l’étiquette du sachet (source: label). Les textes viennent de l’étiquette.
order: 5
product: poudre-de-cacao-100g
source: label
prepMinutes: 5
cookMinutes: 10
title: 'Chocolat chaud maison'
summary: 'Du lait végétal, quelques cuillères de poudre de cacao et dix minutes à feu doux : le chocolat chaud de l’étiquette.'
yield: '1 litre, soit 4 tasses'
ingredients:
  - '1 litre de lait végétal (amande, avoine ou autre)'
  - '2 à 3 cuillères à soupe de poudre de cacao'
  - 'Sucre, selon votre goût'
steps:
  - 'Faites chauffer 1 litre de lait végétal (amande, avoine ou autre).'
  - 'Ajoutez 2 à 3 cuillères à soupe de poudre de cacao.'
  - 'Sucrez selon votre goût et mélangez bien.'
  - 'Laissez frémir 10 minutes en remuant.'
  - 'Dégustez bien chaud.'
tips:
  - 'Pour éviter les grumeaux, délayez d’abord le cacao dans un peu de lait froid, puis versez-le dans le lait chaud.'
  - 'Une pincée de cannelle, une gousse de vanille fendue ou un zeste d’orange pendant qu’il frémit.'
  - 'Notre cacao n’est pas sucré : sucrez petit à petit, en goûtant.'
