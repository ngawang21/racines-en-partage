title: 'Bissap juice'
summary: 'The famous red drink served ice cold in Senegal, at the table and to break the fast: hibiscus flowers intensely steeped, delicately sweetened and scented with mint and vanilla.'
yield: '1 litre, 5 to 6 glasses'
ingredients:
  - '50 g of hibiscus flowers (half the pouch)'
  - '1 litre of water'
  - '80 to 100 g of sugar, to taste'
  - '1 sachet of vanilla sugar (7.5 g)'
  - '1 small bunch of fresh mint (about ten leaves)'
  - '1 teaspoon of orange blossom water (optional)'
  - 'Ice cubes, to serve'
steps:
  - 'Quickly rinse the hibiscus flowers in cold water.'
  - 'Bring the water to the boil, add the flowers and simmer gently for 10 minutes.'
  - 'Off the heat, add the mint leaves and leave to steep for 5 minutes, no longer.'
  - 'Strain into a jug, pressing the flowers well with the back of a spoon.'
  - 'Stir in the sugar and vanilla sugar while the juice is still hot, until they dissolve.'
  - 'Leave to cool, add the orange blossom water, then chill for at least 2 hours.'
  - 'Serve well chilled, over ice.'
tips:
  - 'Cold version, gentler: soak the flowers in cold water in the fridge for at least 4 hours, or overnight, then strain and sweeten.'
  - 'In Senegal, a piece of grated fresh ginger is often steeped with the flowers.'
  - 'It keeps for 3 days in the fridge, in a closed bottle.'
seoTitle: 'Iced bissap juice with mint and vanilla'
seoDescription: 'Bissap juice as made in Senegal: steeped hibiscus flowers, vanilla sugar, fresh mint and a touch of orange blossom. Twenty minutes at the stove, two hours in the fridge.'
