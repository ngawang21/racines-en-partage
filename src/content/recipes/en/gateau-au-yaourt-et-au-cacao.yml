title: 'Cocoa yoghurt cake'
summary: 'The French yoghurt cake of childhood, with some pure cocoa in the flour: a tender, dark crumb with a frank chocolate taste.'
yield: '1 cake, 22 cm, 8 slices'
ingredients:
  - '1 plain yoghurt (125 g)'
  - '150 g of sugar'
  - '3 eggs'
  - '60 ml of neutral oil (half a yoghurt pot)'
  - '160 g of plain flour'
  - '40 g of cocoa powder'
  - '1 sachet of baking powder (11 g)'
  - '1 pinch of salt'
steps:
  - 'Preheat the oven to 180 °C and butter a 22 cm round tin.'
  - 'Empty the yoghurt into a large bowl and keep the pot. Add the sugar and the eggs and whisk until frothy.'
  - 'Stir in the oil.'
  - 'Sift the flour, cocoa powder, baking powder and salt together over the bowl, then mix just enough to get a smooth batter.'
  - 'Pour into the tin and bake for 30 to 35 minutes.'
  - 'Test with the blade of a knife: it should come out dry, or nearly.'
  - 'Leave to cool for 10 minutes before turning out.'
tips:
  - 'No scales? Measure with the empty pot: 2 pots of sugar, 2 and a half pots of flour, half a pot of cocoa, half a pot of oil, 3 eggs and the baking powder. This version is a little sweeter.'
  - 'Cocoa dries a batter quickly: do not overbake, a slightly moist centre is a good sign.'
  - 'Serve it plain, or dusted with cocoa just before serving.'
seoTitle: 'Cocoa yoghurt cake with pure cocoa'
seoDescription: 'The French yoghurt cake made with pure cocoa powder from Côte d’Ivoire: a tender crumb with a frank chocolate taste. 8 slices, 50 minutes.'
