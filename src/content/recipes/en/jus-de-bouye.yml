title: 'Bouye (baobab drink)'
summary: 'Bouye, the baobab drink of Senegal: the powder whisked into water, softened with milk and vanilla, served ice cold. Thick, tangy and velvety.'
yield: 'About 1.2 litres, 6 glasses'
ingredients:
  - '100 g of baobab powder (one 100 g pouch)'
  - '1 litre of cold water'
  - '60 to 80 g of sugar, to taste'
  - '1 sachet of vanilla sugar (7.5 g)'
  - '200 ml of unsweetened evaporated milk, or whole milk'
  - 'A few drops of orange blossom water (optional)'
steps:
  - 'Put the baobab powder in a large bowl and whisk in a glass of water, to avoid lumps.'
  - 'Add the rest of the water little by little, whisking all the time.'
  - 'Leave to rest in the fridge for 1 hour.'
  - 'Pass through a fine sieve for a smooth drink.'
  - 'Add the sugar, the vanilla sugar and the milk, and stir until the sugar dissolves.'
  - 'Scent with a few drops of orange blossom water if you like, and serve ice cold.'
tips:
  - 'The pulp settles at the bottom: stir or shake the bottle before serving.'
  - 'Too thick? Thin it with a little cold water and taste again. With sweetened condensed milk, use less sugar or none.'
  - 'It keeps for 3 days in the fridge, in a closed bottle.'
seoTitle: 'Bouye, the Senegalese baobab drink'
seoDescription: 'Bouye, the Senegalese drink made with baobab powder, milk and vanilla. Ten minutes of preparation, an hour in the fridge, served ice cold.'
