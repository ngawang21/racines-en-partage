# Translated fields only: shared fields (product, source, minutes, image) come from the French file.
title: 'Chilled baobab drink'
summary: 'Baobab powder stirred into tiger nut or almond milk, with mango purée: the house’s chilled, tangy drink, ready in five minutes.'
yield: '1 tall glass'
ingredients:
  - '1 to 2 teaspoons of baobab powder'
  - '250 ml of tiger nut milk or almond milk, to taste'
  - '2 tablespoons of mango purée'
  - '1 teaspoon of honey or sugar, to taste'
  - 'A few ice cubes'
steps:
  - 'Mix the baobab powder with a little milk, then gradually add the rest of the milk.'
  - 'Add the mango purée and stir well.'
  - 'Sweeten to taste and serve well chilled, over the ice.'
tips:
  - 'The pulp naturally settles at the bottom of the glass: remember to stir before drinking.'
  - 'Add a dash of lime juice or a few mint leaves to lift its tangy taste.'
  - 'For the Senegalese version, thicker and softened with milk, try the bouye juice.'
