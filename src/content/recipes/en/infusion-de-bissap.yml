# Translated fields only: shared fields (product, source, minutes, image) come from the French file.
title: 'Bissap infusion'
summary: 'The infusion printed on the label: hibiscus flowers, simmering water and a quarter of an hour of patience. Drink it hot, or well chilled the next day.'
yield: '1 litre'
ingredients:
  - '1 litre of water'
  - '2 to 3 tablespoons of hibiscus flowers'
  - 'Honey, mint or lemon, to taste'
steps:
  - 'Bring 1 litre of water to the boil.'
  - 'Add 2 to 3 tablespoons of hibiscus flowers.'
  - 'Leave to steep for 10 to 15 minutes.'
  - 'Strain and enjoy hot or cold.'
  - 'Add a little honey, mint or lemon to taste.'
tips:
  - 'For an iced drink, let the infusion cool, then chill it for a few hours.'
  - 'Fancy something stronger and sweeter? Try the bissap juice, with mint and vanilla.'
  - 'Hibiscus calyces have a strong colour: rinse the strainer and the cups straight away.'
