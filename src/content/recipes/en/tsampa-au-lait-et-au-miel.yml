title: 'Tsampa with milk and honey'
summary: 'A breakfast porridge ready in five minutes: tsampa whisked into hot milk, a knob of butter, a drizzle of honey. The toasted taste of barley, softened.'
yield: '1 bowl'
ingredients:
  - '250 ml of milk, or plant milk'
  - '4 heaped tablespoons of roasted barley flour (about 40 g)'
  - '1 pinch of salt'
  - '1 knob of butter (optional)'
  - '1 to 2 teaspoons of honey'
steps:
  - 'Heat the milk in a small pan until it just starts to simmer.'
  - 'Sprinkle in the tsampa with the pinch of salt, whisking to avoid lumps.'
  - 'Let it thicken for 2 to 3 minutes over a low heat, stirring all the time.'
  - 'Off the heat, stir in the butter, then pour into a bowl.'
  - 'Drizzle with honey and eat warm.'
tips:
  - 'Tsampa is already roasted: a few minutes on the heat are enough, just for the texture.'
  - 'Cold version: stir 2 tablespoons of tsampa into a yoghurt or some fromage frais, with a little honey.'
  - 'Add a mashed banana, red berries or a pinch of cinnamon.'
seoTitle: 'Tsampa with milk and honey, a breakfast porridge'
seoDescription: 'Tsampa, roasted barley flour, whisked into hot milk with a drizzle of honey: a porridge with a toasted taste, ready in five minutes.'
