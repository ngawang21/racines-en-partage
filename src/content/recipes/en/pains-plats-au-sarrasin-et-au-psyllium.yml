title: 'Buckwheat and psyllium flatbreads'
summary: 'Psyllium swells in warm water and binds the buckwheat flour: a supple dough that rolls out, for flatbreads cooked in a pan, with the frank taste of buckwheat.'
yield: '6 flatbreads'
ingredients:
  - '250 g of buckwheat flour'
  - '15 g of psyllium husk (2 heaped tablespoons)'
  - '280 ml of warm water'
  - '2 tablespoons of olive oil'
  - '1 teaspoon of salt'
  - '1 teaspoon of baking powder'
steps:
  - 'In a bowl, whisk the psyllium with the warm water and the oil. Leave it to swell for 5 minutes: it turns into a gel.'
  - 'In a large bowl, mix the buckwheat flour, salt and baking powder.'
  - 'Add the psyllium gel and mix by hand until you have a ball of supple, slightly sticky dough.'
  - 'Cover and leave to rest for 10 minutes.'
  - 'Divide the dough into 6 balls and roll each one into a thin round between two sheets of baking paper.'
  - 'Cook in a hot, dry frying pan for 2 to 3 minutes on each side, until golden spots appear.'
  - 'Stack the flatbreads in a clean tea towel so they stay soft.'
tips:
  - 'As its pouch says, psyllium is taken with a sufficient amount of water: serve these flatbreads with a large glass of water.'
  - 'Fill them like wraps: soft cheese and herbs, grilled vegetables, hummus.'
  - 'They keep for a day in a tea towel and warm up in a few seconds in the pan.'
seoTitle: 'Buckwheat and psyllium flatbreads, cooked in a pan'
seoDescription: 'Flatbreads made with buckwheat flour, bound with psyllium husk and cooked in a frying pan. Six soft flatbreads, ready in 50 minutes.'
