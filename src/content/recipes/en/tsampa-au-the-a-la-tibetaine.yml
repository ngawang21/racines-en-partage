title: 'Tsampa with tea, the Tibetan way'
summary: 'The simplest thing in Tibetan cooking: tsampa poured into a bowl of salted butter tea and kneaded with the fingertips into small balls with a toasted taste.'
yield: '1 bowl'
ingredients:
  - '250 ml of strong black tea, piping hot'
  - '10 g of butter'
  - '1 pinch of salt'
  - '4 tablespoons of roasted barley flour (about 30 g)'
steps:
  - 'Make a strong black tea. Add the butter and salt and whisk until the butter melts and the tea is a little frothy.'
  - 'Pour a little tea into a bowl, then the tsampa on top.'
  - 'Take a sip, then mix the tsampa and tea with one finger, pressing the flour against the side of the bowl.'
  - 'As it thickens, carry on with your whole hand until you have a supple dough that no longer sticks to your fingers.'
  - 'Shape it into walnut-sized balls and eat them with the rest of the tea.'
tips:
  - 'Dough too sticky? Add a pinch of tsampa. Too dry? A spoon of tea.'
  - 'In Tibet, butter tea is churned at length, and some add sugar or a little dried cheese to their tsampa.'
  - 'Looser, with a spoon: stir the tsampa into the bowl of tea for a thick porridge.'
seoTitle: 'Tsampa with butter tea, the Tibetan way'
seoDescription: 'How to eat tsampa as in Tibet: roasted barley flour mixed into salted butter tea and kneaded into small balls. Ten minutes, one bowl.'
