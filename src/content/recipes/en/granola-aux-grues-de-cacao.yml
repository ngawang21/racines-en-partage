title: 'Cacao nib granola'
summary: 'Oats baked golden with honey, hazelnuts, and cacao nibs for a crunchy bitterness: a granola to scatter over yoghurt or eat with milk.'
yield: '1 large jar, about 500 g'
ingredients:
  - '250 g of rolled oats'
  - '60 g of hazelnuts or almonds, roughly chopped'
  - '40 g of pumpkin or sunflower seeds'
  - '40 g of cacao nibs'
  - '1 pinch of salt'
  - '80 g of honey'
  - '50 ml of sunflower oil'
steps:
  - 'Preheat the oven to 160 °C and line a baking tray with baking paper.'
  - 'In a large bowl, mix the oats, hazelnuts, seeds, cacao nibs and salt.'
  - 'Warm the honey and oil in a small pan, just until runny.'
  - 'Pour them over the dry mix and stir until every flake is coated.'
  - 'Spread evenly on the tray and bake for 25 minutes, stirring halfway.'
  - 'Once golden, let the granola cool completely on the tray: it crisps as it cools.'
  - 'Break it into pieces and tip it into an airtight jar.'
tips:
  - 'For extra crunchy nibs, keep a handful back and add it after baking.'
  - 'Add dried fruit (raisins, apricots, mango) once the granola has cooled.'
  - 'It keeps for 2 to 3 weeks in a tightly closed jar, somewhere dry.'
seoTitle: 'Homemade cacao nib granola'
seoDescription: 'Homemade granola with oats, honey, hazelnuts and cacao nibs from Côte d’Ivoire. Golden and crunchy, 25 minutes in the oven.'
