title: 'Tiger nut pancakes'
summary: 'Some tiger nut powder in the batter: soft pancakes with a gentle taste of hazelnut and almond.'
yield: 'About 12 pancakes'
ingredients:
  - '120 g of wheat flour'
  - '80 g of tiger nut powder'
  - '2 teaspoons of baking powder'
  - '1 tablespoon of sugar'
  - '1 pinch of salt'
  - '2 eggs'
  - '250 ml of milk, or plant milk'
  - '30 g of melted butter, plus a little for the pan'
steps:
  - 'In a large bowl, mix the flour, tiger nut powder, baking powder, sugar and salt.'
  - 'In another bowl, beat the eggs with the milk and the melted butter.'
  - 'Pour the liquid onto the dry ingredients and whisk just enough to get a smooth, thick batter.'
  - 'Leave to rest for 15 minutes: the tiger nut powder soaks up some of the milk.'
  - 'Heat a lightly buttered frying pan over a medium heat and pour in a small ladle of batter per pancake.'
  - 'Flip them when small bubbles appear on the surface, after 1 to 2 minutes, and let them colour for 1 minute on the other side.'
  - 'Serve hot, with honey, maple syrup or fruit.'
tips:
  - 'Batter too thick after resting? Add a spoon or two of milk.'
  - 'For a stronger tiger nut taste, use 100 g of tiger nut powder and 100 g of flour.'
  - 'They keep for a day, wrapped, and warm up in a few seconds in the pan.'
seoTitle: 'Tiger nut powder pancakes'
seoDescription: 'Soft pancakes made with tiger nut powder from Niger, with a gentle hazelnut taste. Makes 12 pancakes, ready in 45 minutes.'
