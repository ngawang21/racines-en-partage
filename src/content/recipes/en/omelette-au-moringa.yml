title: 'Moringa, onion and tomato omelette'
summary: 'Eggs beaten with a spoon of moringa powder, over softened onion and tomato: a pale green omelette with a gently grassy taste.'
yield: 'Serves 2'
ingredients:
  - '4 eggs'
  - '1 teaspoon of moringa powder'
  - '1 onion'
  - '1 tomato'
  - '1 small fresh chilli (optional)'
  - '1 tablespoon of oil'
  - 'Salt and pepper'
steps:
  - 'Beat the eggs with the moringa powder, salt and pepper, until no lumps remain.'
  - 'Finely slice the onion. Deseed the tomato and cut it into small dice.'
  - 'Heat the oil in a frying pan and soften the onion for 3 to 4 minutes over a medium heat.'
  - 'Add the tomato, and the sliced chilli if you like it, and cook for 2 minutes.'
  - 'Pour the eggs into the pan and let them set for 3 to 4 minutes over a medium heat, drawing the edges towards the centre.'
  - 'Fold the omelette in half and serve straight away.'
tips:
  - 'If moringa is new to you, start with half a spoon: its grassy taste, between spinach and green tea, comes through quickly.'
  - 'The same gesture works in a tomato sauce, a soup or stir-fried vegetables: add the powder at the end of cooking and stir well.'
  - 'Serve with bread or plain rice.'
seoTitle: 'Moringa, onion and tomato omelette'
seoDescription: 'An omelette with moringa powder from Niger, onion, tomato and a little chilli: a simple savoury recipe, ready in twenty minutes.'
