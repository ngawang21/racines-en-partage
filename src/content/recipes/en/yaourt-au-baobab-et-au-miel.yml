# Translated fields only: shared fields (product, source, minutes, image) come from the French file.
title: 'Baobab and honey yoghurt'
summary: 'A spoon of baobab powder in plain yoghurt, a drizzle of honey: the tangy taste of the fruit, between lemon and pear, meets the sweetness of honey.'
yield: '1 bowl'
ingredients:
  - '1 plain yoghurt (125 g) or 150 g of fromage frais'
  - '1 teaspoon of baobab powder'
  - '1 teaspoon of honey'
  - 'A few pieces of mango or banana (optional)'
steps:
  - 'Spoon the yoghurt into a bowl.'
  - 'Sprinkle over the baobab powder and stir well, until it disappears.'
  - 'Drizzle with the honey and, if you like, add the pieces of fruit.'
  - 'Eat straight away.'
tips:
  - 'For crunch, scatter over a few cacao nibs or a spoon of granola.'
  - 'Swap the honey for maple syrup, and the yoghurt for a plant-based one.'
  - 'Start with one spoon, then adjust to the tang you like.'
seoTitle: 'Baobab and honey yoghurt'
seoDescription: 'Plain yoghurt, a spoon of Senegalese baobab powder and a drizzle of honey: a tangy, gentle bowl, ready in three minutes.'
