title: 'Tiger nut horchata (tiger nut milk)'
summary: 'The tiger nuts soak overnight, then blend with fresh water: a gentle plant milk that tastes of almond and hazelnut.'
yield: 'About 1 litre'
ingredients:
  - '250 g of tiger nuts'
  - '1 litre of water for soaking'
  - '1 litre of fresh water'
  - 'Honey or syrup, to taste'
steps:
  - 'Soak 250 g of tiger nuts in 1 litre of water for 12 hours.'
  - 'Drain and rinse.'
  - 'Blend with 1 litre of fresh water.'
  - 'Strain through a clean cloth.'
  - 'Sweeten to taste (honey, syrup, etc.).'
