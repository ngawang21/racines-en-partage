    {
      fr: 'Deux terres. Un rituel. Un bien-être à partager.',
      en: 'Two lands. One ritual. Well-being to share.',
    }
  email: racinesenpartage@gmail.com
  phone: '0775689108'
  address: { street: 9 Rue du Marché, postcode: '95400', city: Arnouville, country: FR }
  instagram: '' # URL or empty
  siret: '911 858 843 00020' # 14 digits; the legal texts print the SIREN (first 9) and the SIRET
