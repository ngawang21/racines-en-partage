name: Whole tiger nuts
tagline: Small whole tubers, for homemade tiger nut milk.
description: >-
  Whole and dried, tiger nuts can be nibbled after soaking or blended into
  horchata, a mild and refreshing plant milk. Their taste recalls hazelnut and
  almond.
ingredients: 100% tiger nut tubers (no additives, no preservative, no colouring).
usage:
  - Add to your drinks, cooking or recipes as you like.
  - As plant milk, in a smoothie or a yoghurt.
  - In your bakes, soups or desserts.
recipe:
  title: Tiger nut horchata (tiger nut milk)
  steps:
    - Soak 250 g of tiger nuts in 1 litre of water for 12 hours.
    - Drain and rinse.
    - Blend with 1 litre of fresh water.
    - Strain through a clean cloth.
    - Sweeten to taste (honey, syrup, etc.).
benefits:
  - Whole dried tubers, nothing added
  - Gluten free
  - They taste of hazelnut and almond, for a homemade tiger nut milk
storage: Store in a dry place, away from heat and moisture. Close tightly after opening.
seoTitle: Whole dried tiger nuts, 200 g
seoDescription: >-
  Whole dried tiger nuts, no additives. Recipe for horchata, homemade tiger nut
  milk, included.
