name: Tiger nut powder
tagline: The natural sweetness of tiger nut, ready to mix.
origin: Niger
description: >-
  Our tiger nut powder (Cyperus esculentus) from Niger is made from dried,
  ground tubers. Also called earth almond, chufa in Spain or tchongon in Côte
  d’Ivoire, tiger nut stands out for its fine texture and its mild, slightly
  sweet flavour with notes of hazelnut. Add it as you like to your drinks,
  porridges, cake batters and cooking.
ingredients: 100% plant-based product, gluten free. Powder made by grinding tiger nut tubers.
usage:
  - Add to your drinks, raw or cooked dishes, or recipes as you like.
howMade: Tiger nut powder is made by grinding tiger nut tubers.
benefits:
  - Gluten free
  - Ground tiger nuts, nothing added
  - A mild taste of hazelnut and almond
