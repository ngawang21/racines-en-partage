name: Roasted barley flour
tagline: Tsampa, a roasted barley flour with a delicately toasted taste.
origin: Germany, Sonam’Tsampa
description: >-
  Our tsampa is a roasted barley flour from Germany (Sonam’Tsampa), with a
  toasted taste close to barley coffee. A source of plant protein and rich in
  fibre, it goes into breakfast, a smoothie or a batter, or makes flatbreads. It
  also goes well with tea, fromage blanc and yoghurt. Barley contains gluten:
  not suitable for people with coeliac disease.
ingredients: 100% roasted barley (no additives, no preservative, no colouring).
usage:
  - Add to your drinks, cooking (soups, porridges, pancakes, etc.) or sprinkle over your dishes.
  - In your smoothies.
  - In your yoghurts, soups or desserts.
benefits:
  - Rich in fibre
  - Roasted barley grains, milled, nothing added
  - A toasted taste, close to barley coffee
keywords:
  - tsampa
