name: Roasted barley flour
tagline: Tsampa, roasted barley flour that smells of warm bread.
description: >-
  Barley grains, roasted then finely milled: a powder with a toasty taste, close
  to bread fresh from the oven. Stir it into a hot drink, thicken a soup with it
  or add it to a pancake batter.
ingredients: 100% roasted barley (no additives, no preservative, no colouring).
usage:
  - Add to your drinks, cooking (soups, porridges, gruels, pancakes, etc.) or sprinkle over your dishes.
  - In a large glass of water, in the morning or before a meal.
  - In your smoothies.
  - In your yoghurts, soups or desserts.
benefits:
  - Rich in fibre
  - Source of plant protein
  - Source of minerals (iron, calcium, magnesium, phosphorus, potassium)
  - Moderate glycaemic index (about 35)
storage: Store in a dry place, away from heat and moisture. Close tightly after opening.
seoTitle: Roasted barley flour (tsampa), 100 g
seoDescription: >-
  Sonam’Tsampa roasted barley flour with a toasty taste. For your drinks,
  porridges, soups and pancakes. No additives, no preservative.
