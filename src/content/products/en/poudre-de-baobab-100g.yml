name: Baobab powder
tagline: The tangy pulp of "monkey bread", the baobab fruit from Senegal.
origin: Senegal
description: >-
  Our baobab powder (Adansonia digitata) from Senegal is made from the fruit
  pulp, dried then ground. Also called "monkey bread", the baobab fruit holds a
  naturally powdery pulp with a tangy, slightly sweet taste and notes of lemon
  and pear. With no additives and no preservatives, stir it as you like into a
  cold drink, a porridge, a compote or your cooking.
ingredients: 100% powdered baobab fruit pulp. No additive. No colouring. No preservative.
usage:
  - Stir into drinks and fruit juices, smoothies, yoghurts and compotes, cereals and porridges, bakes and desserts.
  - Stir well before use.
howMade: >-
  Baobab powder is made from the dried pulp of the baobab fruit. After harvest,
  the naturally dry pulp is separated from the seeds and fibres, then reduced to
  a fine powder.
benefits:
  - Baobab fruit pulp, dried and sieved
  - Tangy, slightly sweet taste
  - No additives, no preservatives
storage: Store in a dry place, away from heat and moisture. Close tightly after opening.
