name: Baobab powder
tagline: The tangy pulp of the baobab fruit, from Senegal.
origin: Senegal
description: >-
  Baobab fruit pulp dries naturally inside its shell. Separated from the seeds
  and fibres, it becomes a pale powder with a tangy, almost citrus taste.
  Delicious in a cold drink, a porridge or a compote.
ingredients: 100% powdered baobab fruit pulp. No additive. No colouring. No preservative.
usage:
  - Stir into drinks and fruit juices, smoothies, yoghurts and compotes, cereals and porridges, bakes and desserts.
  - Stir well before use.
howMade: >-
  Baobab powder is made from the dried pulp of the baobab fruit. After harvest,
  the naturally dry pulp is separated from the seeds and fibres, then reduced to
  a fine powder.
recipe:
  title: Chilled baobab drink
  ingredients:
    - 1 to 2 teaspoons of baobab powder
    - 250 ml of cold water
    - 1 teaspoon of honey or sugar, to taste
    - A few ice cubes
  steps:
    - Mix the baobab powder with a little water, then gradually add the rest of the water.
    - Sweeten to taste and serve well chilled.
benefits:
  - Baobab fruit pulp, dried and sieved
  - Tangy, slightly sweet taste
storage: Store in a dry place, away from heat and moisture. Close tightly after opening.
seoTitle: Baobab powder from Senegal, 100 g
seoDescription: >-
  Baobab fruit pulp powder from Senegal, no additive, no preservative. Tangy
  taste, chilled drink recipe included.
