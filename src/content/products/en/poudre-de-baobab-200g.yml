name: Baobab powder
tagline: The large pouch, for everyday baobab.
origin: Senegal
description: >-
  The same baobab pulp powder from Senegal, in a 200 g pouch for those who have
  made it a habit. Also called "monkey bread", the baobab fruit holds a
  naturally powdery pulp with a tangy, slightly sweet taste and notes of lemon
  and pear. A cold drink, a porridge, a compote: it finds its place everywhere.
ingredients: 100% powdered baobab fruit pulp. No additive. No colouring. No preservative.
usage:
  - Stir into drinks and fruit juices, smoothies, yoghurts and compotes, cereals and porridges, bakes and desserts.
  - Stir well before use.
benefits:
  - Baobab fruit pulp, dried and sieved
  - Tangy, slightly sweet taste
  - A 200 g size for everyday use
storage: Store in a dry place, away from heat and moisture. Close tightly after opening.
