name: Psyllium husk
tagline: The husk of blond psyllium seeds, rich in fibre.
description: >-
  The husk is the thin outer layer of psyllium seeds. In contact with a liquid,
  it forms a soft gel with a neutral taste. Add it to a large glass of water, to
  a yoghurt, or to a gluten-free bread dough to bind it.
ingredients: 100% natural psyllium husk, no additive, no gluten.
usage:
  - Add to your drinks, raw or cooked dishes, or recipes as you like.
benefits:
  - Rich in dietary fibre
  - Supports intestinal transit
  - Aids digestion
  - Contributes to the maintenance of normal cholesterol levels
  - 100% natural
storage: Store in a dry place, away from heat and moisture. Close tightly after opening.
