name: Psyllium husk
tagline: The husk of blond psyllium seeds, also called ispaghula.
origin: India
description: >-
  Psyllium husks, also called ispaghula or isabgol, are the thin outer layers of
  the Plantago ovata seed, from India. In contact with water, they swell and
  form a soft gel with a neutral taste. Add them to a large glass of water, to a
  yoghurt, or to a gluten-free bread dough to bind it. Make sure you take them
  with enough water and follow the instructions on the pouch.
ingredients: 100% natural psyllium husk, no additive, no gluten.
usage:
  - Add to your drinks, raw or cooked dishes, or recipes as you like.
  - Take with plenty of water.
benefits:
  - The husks of Plantago ovata seeds
  - Forms a soft gel with a neutral taste
  - 100% natural
