name: Moringa powder
tagline: The bright green of Nigerien leaves, in a fine powder.
origin: Niger
description: >-
  Add a touch of moringa to your recipes! Our moringa leaves from Niger are
  dried, then ground into a fine powder, and nothing else. Nicknamed the "tree
  of life", moringa has long been eaten in several parts of West Africa,
  including Niger, Mali, Côte d’Ivoire and Senegal. Its gently grassy powder
  slips into a smoothie, a yoghurt or a sauce. The 100 g pouch, to get
  acquainted.
ingredients: >-
  100% Moringa leaves (Moringa oleifera), dried and ground. No additive. No
  colouring. No preservative.
usage:
