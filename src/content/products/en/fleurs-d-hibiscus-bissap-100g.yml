name: Hibiscus flowers (bissap)
tagline: Ruby red bissap calyces from Cameroon, to enjoy hot or iced.
origin: Cameroon
description: >-
  Make a colourful, fragrant infusion at home with our hibiscus flowers
  (Hibiscus sabdariffa) from Cameroon, grown with care and gently dried to keep
  their bright colour, from ruby red to deep purple, and their fruity scent. The
  calyces, the part that protects the flower, make a drink known by many names
  across Africa: bissap in Côte d’Ivoire and Senegal, foléré in Cameroon, dah in
  Guinea, wonjo in the Gambia, zobo in Nigeria, or karkadé in Egypt and Sudan.
  Enjoy it hot or cold, as you like.
ingredients: 100% dried hibiscus flowers (calyces). No additives, no preservative, no colouring, no gluten.
usage:
  - Use in your drinks, infusions, syrups, juices or recipes as you like.
  - As a hot or cold infusion.
  - In your smoothies.
  - To make natural syrups or juices.
recipe:
  title: Bissap infusion
  steps:
    - Bring 1 litre of water to the boil.
    - Add 2 to 3 tablespoons of hibiscus flowers.
    - Leave to steep for 10 to 15 minutes.
    - Strain and enjoy hot or cold.
    - Add a little honey, mint or lemon to taste.
benefits:
  - 100% natural hibiscus flowers
  - Carefully dried to keep aroma and colour
  - Controlled size and freshness
storage: >-
  Keep unused flowers in an airtight container, away from light and moisture,
  to preserve their aroma and their bright colour.
