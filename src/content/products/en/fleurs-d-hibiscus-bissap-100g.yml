name: Hibiscus flowers (bissap)
tagline: Deep red bissap calyces, to enjoy hot or iced.
description: >-
  The dried calyces of the hibiscus flower make bissap, the ruby red drink
  shared from Dakar to Abidjan. Steeped, they give a fruity, tangy flavour: hot
  in winter, or iced with fresh mint in summer.
ingredients: 100% dried hibiscus flowers (calyces). No additives, no preservative, no colouring, no gluten.
usage:
  - Use in your drinks, infusions, syrups, juices or recipes as you like.
  - As a hot or cold infusion.
  - In your smoothies.
  - To make natural syrups or juices.
recipe:
  title: Bissap infusion
  steps:
    - Bring 1 litre of water to the boil.
    - Add 2 to 3 tablespoons of hibiscus flowers.
    - Leave to steep for 10 to 15 minutes.
    - Strain and enjoy hot or cold.
    - Add a little honey, mint or lemon to taste.
benefits:
  - Rich in antioxidants
  - Source of vitamin C
  - Contributes to good hydration
  - Fruity and refreshing taste
storage: Store in a dry place, away from heat and moisture. Close tightly after opening.
seoTitle: Dried hibiscus flowers for bissap, 100 g
seoDescription: >-
  Dried hibiscus calyces to make bissap, hot or iced. No additives, no
  preservative. Infusion recipe included.
