name: Téguments de psyllium
tagline: L’enveloppe des graines de psyllium blond, aussi appelée ispaghul.
description: >-
  Les téguments de psyllium, aussi appelés ispaghul ou cosses de psyllium, sont
  les fines enveloppes de la graine de Plantago ovata, venue d’Inde. Au contact
  de l’eau, ils gonflent et forment un gel doux, neutre en goût. On les ajoute à
  un grand verre d’eau, à un yaourt, ou à une pâte à pain sans gluten pour la
  lier. Veillez à les consommer avec suffisamment d’eau et à suivre les
  instructions figurant sur l’emballage.
ingredients: Téguments de Psyllium 100 % naturels, sans additif, sans gluten.
usage:
  - À incorporer dans vos boissons, préparations crues ou cuites ou recettes selon vos envies.
  - À consommer avec une quantité suffisante d’eau.
