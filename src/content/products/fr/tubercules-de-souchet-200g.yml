name: Tubercules de souchet
tagline: Le tchongon du Niger, entier, pour un lait de souchet maison.
description: >-
  Le souchet (Cyperus esculentus) est un petit tubercule rond et ferme, à la
  peau striée, qui nous vient du Niger. Il est aussi connu sous les noms
  d’amande de terre, de noix tigrée, de pois sucré ou de chufa ; en Afrique de
  l’Ouest, on l’appelle notamment tchongon en Côte d’Ivoire. Sa saveur
  naturellement douce, entre noisette et amande, et sa texture croquante
  permettent de le déguster tel quel ou après trempage, ou de le mixer en
  horchata, ce lait végétal doux et frais.
ingredients: 100 % tubercules de souchet (sans additifs, sans conservateur, sans colorant).
usage:
  - À incorporer dans vos boissons, préparations culinaires ou recettes selon vos envies.
  - En lait végétal, smoothie ou yaourt.
  - Dans vos pâtisseries, soupes ou desserts.
recipe:
  title: Horchata de souchet (lait de souchet)
  steps:
    - Faites tremper 250 g de tubercules de souchet dans 1 litre d’eau pendant 12 h.
    - Égouttez et rincez.
    - Mixez avec 1 litre d’eau fraîche.
    - Filtrez à l’aide d’un tissu propre.
    - Sucrez selon votre goût (miel, sirop, etc.).
benefits:
  - Tubercules entiers, séchés, sans rien ajouter
  - Sans gluten
  - Goût de noisette et d’amande, pour un lait de souchet maison
