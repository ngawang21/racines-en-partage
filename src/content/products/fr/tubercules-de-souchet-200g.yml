name: Tubercules de souchet
tagline: Les petits tubercules entiers, pour un lait de souchet maison.
description: >-
  Entiers et séchés, les tubercules de souchet se croquent après trempage ou se
  mixent en horchata, ce lait végétal doux et frais. Leur goût rappelle la
  noisette et l’amande.
ingredients: 100 % tubercules de souchet (sans additifs, sans conservateur, sans colorant).
usage:
  - À incorporer dans vos boissons, préparations culinaires ou recettes selon vos envies.
  - En lait végétal, smoothie ou yaourt.
  - Dans vos pâtisseries, soupes ou desserts.
recipe:
  title: Horchata de souchet (lait de souchet)
  steps:
    - Faites tremper 250 g de tubercules de souchet dans 1 litre d’eau pendant 12 h.
    - Égouttez et rincez.
    - Mixez avec 1 litre d’eau fraîche.
    - Filtrez à l’aide d’un tissu propre.
    - Sucrez selon votre goût (miel, sirop, etc.).
benefits:
  - Source de fibres
  - Source de protéines végétales
  - Source de magnésium, de fer, de phosphore et de potassium
storage: Conserver dans un endroit sec, à l’abri de la chaleur et de l’humidité. Bien refermer après ouverture.
