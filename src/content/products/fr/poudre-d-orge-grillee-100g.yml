name: Poudre d’orge grillée
tagline: La tsampa, une poudre d’orge grillée au goût délicatement toasté.
description: >-
  Notre tsampa est une poudre d’orge grillée d’Allemagne (Sonam’Tsampa), au goût
  toasté proche du café d’orge. Source de protéines végétales et riche en
  fibres, elle s’incorpore au petit-déjeuner, dans un smoothie ou une pâte, ou
  sert à préparer des galettes. Elle accompagne aussi le thé, le fromage blanc
  et le yaourt. L’orge contient du gluten : déconseillée aux personnes atteintes
  de la maladie cœliaque.
ingredients: 100 % orge grillée (sans additifs, sans conservateur, sans colorant).
