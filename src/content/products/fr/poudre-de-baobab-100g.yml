name: Poudre de baobab
tagline: La pulpe acidulée du « pain de singe », le fruit du baobab du Sénégal.
description: >-
  Notre poudre de baobab (Adansonia digitata) du Sénégal est obtenue à partir
  de la pulpe du fruit, séchée puis broyée. Aussi appelé « pain de singe », le
  fruit du baobab renferme une pulpe naturellement poudreuse au goût acidulé et
  légèrement sucré, avec des notes de citron et de poire. Sans additifs ni
  conservateurs, elle s’incorpore selon vos envies dans une boisson fraîche, un
  porridge, une compote ou vos préparations.
ingredients: 100 % pulpe de fruit de baobab en poudre. Sans additif. Sans colorant. Sans conservateur.
usage:
  - À incorporer dans les boissons et jus de fruits, les smoothies, les yaourts et compotes, les céréales et porridges, les préparations et desserts.
  - Mélangez bien avant de servir.
howMade: >-
  La poudre de baobab est obtenue à partir de la pulpe séchée du fruit du
  baobab. Après récolte, la pulpe naturellement sèche est séparée des graines et
  des fibres, puis réduite en une poudre fine.
recipe:
  title: Boisson fraîche au baobab
  ingredients:
    - 1 à 2 cuillères à café de poudre de baobab
    - 250 ml d’eau fraîche
    - 1 cuillère à café de miel ou de sucre selon votre goût
    - Quelques glaçons
  steps:
    - Mélanger la poudre de baobab avec un peu d’eau, puis ajouter progressivement le reste de l’eau.
    - Sucrer selon votre goût et servir bien frais.
benefits:
  - Pulpe du fruit du baobab, séchée et tamisée
  - Goût acidulé, légèrement sucré
  - Sans additifs ni conservateurs
storage: Conserver dans un endroit sec, à l’abri de la chaleur et de l’humidité. Bien refermer après ouverture.
