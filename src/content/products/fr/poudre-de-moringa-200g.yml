tagline: Le grand format pour un rituel de chaque jour.
description: >-
  La même poudre de feuilles de moringa du Niger, en sachet de 200 g pour celles
  et ceux qui en ont fait une habitude. Surnommé « arbre de vie », le moringa
  est consommé depuis longtemps au Niger, au Mali, en Côte d’Ivoire et au
  Sénégal. Source de protéines végétales et riche en fibres, sa poudre trouve sa
  place partout : un smoothie, une soupe, une sauce, un yaourt.
ingredients: >-
  100 % feuilles de moringa séchées, broyées. Produit fini vendu en poudre (non
  en feuilles entières). Sans additifs, sans conservateur, sans colorant, sans
  gluten.
usage:
