name: Poudre de baobab
tagline: Le grand format, pour le baobab de tous les jours.
description: >-
  La même poudre de pulpe de baobab du Sénégal, en sachet de 200 g pour celles
  et ceux qui en ont fait une habitude. Aussi appelé « pain de singe », le fruit
  du baobab renferme une pulpe naturellement poudreuse au goût acidulé et
  légèrement sucré, avec des notes de citron et de poire. Une boisson fraîche,
  un porridge, une compote : elle trouve sa place partout.
ingredients: 100 % pulpe de fruit de baobab en poudre. Sans additif. Sans colorant. Sans conservateur.
usage:
