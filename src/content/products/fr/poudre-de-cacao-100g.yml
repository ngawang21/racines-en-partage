recipe:
  title: Chocolat chaud maison
  steps:
    - Faites chauffer 1 litre de lait végétal (amande, avoine ou autre).
    - Ajoutez 2 à 3 cuillères à soupe de poudre de cacao.
    - Sucrez selon votre goût et mélangez bien.
    - Laissez frémir 10 minutes en remuant.
    - Dégustez bien chaud.
