name: Fleurs d’hibiscus (bissap)
tagline: Les calices rouge rubis du bissap, du Cameroun, à boire chaud ou glacé.
description: >-
  Préparez chez vous une infusion colorée et parfumée avec nos fleurs d’hibiscus
  (Hibiscus sabdariffa) séchées, venues du Cameroun. Leur couleur va du rouge
  rubis au pourpre sombre, leur parfum est fruité. Ce sont les calices, la
  partie qui protège la fleur, qui donnent cette boisson connue sous bien des
  noms en Afrique : bissap en Côte d’Ivoire et au Sénégal, foléré au Cameroun,
  dah en Guinée, wonjo en Gambie, zobo au Nigeria ou encore karkadé en Égypte et
  au Soudan. Elle se déguste chaude ou froide, selon vos envies.
ingredients: 100 % fleurs d’hibiscus séchées (calices). Sans additifs, sans conservateur, sans colorant, sans gluten.
usage:
  - À incorporer dans vos boissons, infusions, sirops, jus ou recettes selon vos envies.
  - En infusion chaude ou froide.
  - Dans vos smoothies.
  - Pour la préparation de sirops ou de jus naturels.
recipe:
  title: Infusion de bissap
  steps:
    - Faites bouillir 1 litre d’eau.
    - Ajoutez 2 à 3 cuillères à soupe de fleurs d’hibiscus.
    - Laissez infuser 10 à 15 minutes.
    - Filtrez et dégustez chaud ou froid.
    - Vous pouvez ajouter un peu de miel, de menthe ou de citron selon vos goûts.
benefits:
  - Fleurs d’hibiscus 100 % naturelles
  - Calices de bissap séchés, du Cameroun
  - Se prépare chaud ou glacé
storage: >-
  Conservez les fleurs non utilisées dans un récipient hermétique, à l’abri de
  la lumière et de l’humidité, pour garder intactes leurs qualités aromatiques
  et leur couleur vive.
