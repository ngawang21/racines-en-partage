name: Poudre de moringa
tagline: Le vert franc des feuilles du Niger, dans une poudre fine.
description: >-
  Ajoutez une touche de moringa à vos recettes ! Nos feuilles de moringa du
  Niger sont séchées puis broyées en une poudre fine, rien d’autre. Surnommé «
  arbre de vie », le moringa est consommé depuis longtemps dans plusieurs
  régions d’Afrique de l’Ouest, notamment au Niger, au Mali, en Côte d’Ivoire et
  au Sénégal. Sa poudre à la saveur légèrement herbacée se glisse dans un
  smoothie, un yaourt ou une sauce.
  Le format 100 g, pour faire connaissance.
ingredients: >-
  100 % feuilles de Moringa (Moringa oleifera) séchées et broyées. Sans
  additif. Sans colorant. Sans conservateur.
usage:
  - À incorporer dans les smoothies, les jus de fruits, les yaourts et compotes, les sauces et les préparations culinaires.
  - Commencer par une petite quantité et ajuster selon vos envies.
howMade: >-
  La poudre de moringa est obtenue à partir des feuilles séchées, qui sont
  soigneusement broyées pour obtenir une poudre fine et naturelle.
benefits:
  - Feuilles de moringa du Niger
  - Feuilles séchées et réduites en poudre, sans rien ajouter
  - Goût herbacé, entre épinard et thé vert
