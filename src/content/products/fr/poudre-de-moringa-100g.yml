name: Poudre de moringa
tagline: Le vert franc des feuilles du Niger, dans une poudre fine.
description: >-
  Des feuilles de moringa séchées puis broyées, rien d'autre. Sa saveur
  végétale, légèrement herbacée, se glisse dans un smoothie, un yaourt ou une
  sauce. Le format 100 g, idéal pour faire connaissance.
ingredients: >-
  100 % feuilles de Moringa (Moringa oleifera) séchées et broyées. Sans
  additif. Sans colorant. Sans conservateur.
usage:
  - À incorporer dans les smoothies, les jus de fruits, les yaourts et compotes, les sauces et les préparations culinaires.
  - Commencer par une petite quantité et ajuster selon vos envies.
howMade: >-
  La poudre de Moringa est obtenue à partir des feuilles séchées, qui sont
  soigneusement broyées pour obtenir une poudre fine et naturelle.
recipe:
  title: Smoothie au Moringa
  ingredients:
    - 1 cuillère à café de poudre de Moringa
    - 1 banane bien mûre
    - 1 pomme ou quelques morceaux d'ananas
    - 200 ml d'eau ou de lait végétal
    - 1 cuillère à café de miel selon votre goût
    - Quelques glaçons
  steps:
    - Mettre tous les ingrédients dans un mixeur.
    - Mixer jusqu'à obtenir une préparation homogène et onctueuse.
    - Servir frais.
benefits:
  - Naturellement source de protéines, fer, calcium, polyphénols
storage: Conserver dans un endroit sec, à l'abri de la chaleur et de l'humidité. Bien refermer après ouverture.
